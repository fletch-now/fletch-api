name: ci

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commits, not tags: a tag can be moved. The version each
# commit is on is in the comment beside it. `npm ci --ignore-scripts` because no
# dependency in the lockfile needs an install script.
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generated types match the snapshot
        run: |
          npm run generate
          git diff --exit-code -- packages/fletch-sdk/src/generated
      - run: npm run typecheck
      - name: Offline tests
        run: npm run test:offline
      - name: Built package carries its generated types
        run: |
          npm run build --workspace fletch-sdk
          test -f packages/fletch-sdk/dist/generated/openapi.d.ts
          npm pack --dry-run --workspace fletch-sdk 2>&1 | grep -q "dist/generated/openapi.d.ts"

  # Reads https://fletch.now/api/v1 four times. Its own job, and allowed to fail,
  # so a deploy window or a rate limit cannot block a pull request.
  live:
    runs-on: ubuntu-latest
    needs: node
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Live tests against https://fletch.now/api/v1
        run: npm test --workspace fletch-sdk

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m unittest -v
        working-directory: webhooks/python

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
      - run: gofmt -l . && test -z "$(gofmt -l .)"
        working-directory: webhooks/go
      - run: go vet ./... && go test -v ./...
        working-directory: webhooks/go
